name: ci

on:
  push:
  pull_request:

jobs:
  python-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py remote_dock\__init__.py remote_dock\config.py remote_dock\input_control.py remote_dock\server.py remote_dock\tray.py remote_dock\app.py

